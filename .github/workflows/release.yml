name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA that passed required CI
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      SOURCE_REPOSITORY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || github.repository }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
      SOURCE_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || '' }}
      CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
    steps:
      - name: Validate release provenance and required CI
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          SOURCE_REPOSITORY: ${{ env.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          SOURCE_EVENT: ${{ env.SOURCE_EVENT }}
          CI_RUN_ID: ${{ env.CI_RUN_ID }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            if (!/^[0-9a-f]{40}$/i.test(String(sha || ""))) throw new Error(`Invalid release SHA: ${sha}`);
            if (process.env.SOURCE_REPOSITORY !== `${owner}/${repo}`) throw new Error("Release source repository is not this repository");
            if (context.eventName === "workflow_run" && (process.env.SOURCE_BRANCH !== "main" || process.env.SOURCE_EVENT !== "push")) {
              throw new Error("Automatic release requires a successful CI push on main");
            }
            const workflow = (await github.rest.actions.getWorkflow({ owner, repo, workflow_id: "ci.yml" })).data;
            if (workflow.path !== ".github/workflows/ci.yml") throw new Error("Required CI workflow could not be verified");
            const isPassingCiRun = (run) =>
              String(run.workflow_id) === String(workflow.id) &&
              run.head_sha === sha &&
              run.status === "completed" &&
              run.conclusion === "success" &&
              run.event === "push" &&
              run.head_branch === "main" &&
              run.repository?.full_name === `${owner}/${repo}` &&
              run.head_repository?.full_name === `${owner}/${repo}`;
            let passing;
            if (context.eventName === "workflow_run") {
              const runId = process.env.CI_RUN_ID;
              if (!/^\d+$/.test(runId || "")) throw new Error("Triggering CI run ID is invalid");
              const triggeringRun = (await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: Number(runId)
              })).data;
              if (String(triggeringRun.id) !== runId || !isPassingCiRun(triggeringRun)) {
                throw new Error(`Triggering CI run ${runId} does not validate release SHA ${sha}`);
              }
              passing = triggeringRun;
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: workflow.id, head_sha: sha, status: "completed", per_page: 100
              });
              passing = runs.find(isPassingCiRun);
              if (!passing) throw new Error(`No successful required CI run found for ${sha}`);
            }
            core.info(`Release source ${sha} verified by CI run ${passing.id}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify source SHA and CI result
        run: test "$RELEASE_SHA" = "$(git rev-parse HEAD)"

      - name: Schema compatibility comparison
        run: npm run db:check

      # A release that cannot probe the deployed build has verified nothing, so this
      # step fails closed: an unconfigured PRODUCTION_URL is an error, not a skip.
      - name: Vercel deployment smoke check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/release-deployment-smoke.mjs

      - name: Publish evidence
        if: always()
        run: |
          mkdir -p artifacts/readiness
          printf '{"sha":"%s","generated_at":"%s","workflow":"%s"}\n' "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_WORKFLOW" > artifacts/readiness/release-evidence.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ env.RELEASE_SHA }}
          path: artifacts/readiness
          if-no-files-found: error
