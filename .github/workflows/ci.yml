name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so the migration integrity gate can
          # resolve the approved baseline commit; a shallow clone would
          # otherwise silently fail baseline comparison.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Migration static checks
        run: npm run db:check

      - name: Migration history integrity check (read-only)
        run: npm run db:history:check

      - name: Migration history integrity gate behavioral tests
        run: npm run test:migration-integrity
      - name: OPD dispense golden journey (domain)
        run: npm run test:opd-dispense-golden
      - name: Encounter close-gate tests
        run: |
          npm run test:encounter-close-gate
          npm run test:clinical-writeup
          npm run test:hospital-closeout-golden
          npm run test:hospital-golden-journey
          npm run test:inpatient-lifecycle
          npm run test:referral-lifecycle
          npm run test:lab-golden-journey
          npm run test:lab-workflow-retry
          npm run test:ehr-continuity-golden
          npm run test:clinical-payment
          npm run test:clinical-offline-writeup

      - name: Clinical cache security regression
        run: |
          node --test scripts/clinical-cache-security.test.mjs
          npx vitest run 'apps/web/src/app/api/opd/encounters/[id]/write-up/route.test.ts'

      - name: Remaining RC1 domain and route regression suites
        run: |
          npm run test:memory-sync-outbox
          npm run test:lab-actions
          npm run test:clinical-offline-disposition
          npm run test:clinical-offline-triage
          npm run test:clinical-offline-prescribe

      - name: Consolidation security regressions
        run: npm run test:consolidation

      - name: Platform admin guard audit
        run: node scripts/check-platform-admin-guards.mjs

      - name: Web lint
        run: npm run lint --workspace @synapse/web

      - name: Web type-check
        run: npm run type-check --workspace @synapse/web

      - name: Web build
        run: npm run verify:web

      - name: Pharmacy verification
        run: npm run verify:pharmacy

      - name: Control-plane tests
        run: npm run test:control-plane

      - name: MFA session boundary tests
        run: npx vitest run packages/auth/src/mfa-recency.test.ts

      - name: Isolated PostgreSQL invitation acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness
          bash scripts/db-tests/run-isolated.sh 2>&1 | tee artifacts/readiness/invitation-postgres.log

      - name: Retain PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-postgres-${{ github.sha }}
          path: artifacts/readiness/invitation-postgres.log
          if-no-files-found: warn

      - name: Retain route and ACL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-green-evidence-${{ github.sha }}
          path: artifacts/readiness
          if-no-files-found: warn

      - name: Tenancy isolation tests
        run: npm run test:tenancy

      - name: Lab Edge tests
        run: npm run test:lab-edge

      - name: Expo type-check
        run: npm run type-check --workspace @synapse/app

      - name: Expo Android export
        run: npm run export:android --workspace @synapse/app

      - name: Capability consistency checks
        run: node -e "const fs=require('fs'); const p='docs/implementation/capability-registry.json'; if(!fs.existsSync(p)){console.error('Missing capability registry'); process.exit(1)} console.log('capability registry exists')"

      - name: Security assertions
        run: |
          npm run test:workflow-safety && node scripts/check-workflow-safety.mjs
          npx tsx --test packages/auth/src/e2e-otp.test.ts packages/auth/src/password.test.ts e2e/os-location.test.ts

      - name: Route and link integrity
        run: npm run test:routes

      - name: Database ACL static inventory
        run: npm run test:db-acl

      - name: RLS tenancy matrix contract
        run: npm run test:rls-matrix

      - name: Signed record, lifecycle, billing authority, MPI
        run: npm run test:signed-record

      - name: FHIR contract tests
        run: npm run test:fhir

      - name: ICD-11 outage survival
        run: npm run test:icd11

      - name: CodeQL high-severity remediation regressions (XSS, ReDoS, randomness, bridge hashing)
        run: npm run test:security-remediation

      - name: Clinical AI policy
        run: npm run test:ai-governance

      - name: Accessibility smoke
        run: npm run test:a11y-smoke

      - name: Secret scan
        run: npm run test:secrets

      - name: Dependency audit evidence
        run: |
          mkdir -p artifacts/readiness
          npm audit --json > artifacts/readiness/npm-audit.json || true
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('artifacts/readiness/npm-audit.json','utf8')); const vulns=j.metadata?.vulnerabilities||{}; console.log('npm audit', JSON.stringify(vulns));"

      - name: Demo Golden Journey Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:demo

      - name: OS surface Playwright (nonprivileged)
        run: npm run test:e2e:hospital

      - name: Readiness evidence gate behavioral tests
        run: npm run test:readiness-report

  required:
    needs: verify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any required gate failed
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "CI / required failed"
            exit 1
          fi
          echo "CI / required passed"
